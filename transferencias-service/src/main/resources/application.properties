spring.application.name=transferencias-service
server.port=8082

# Endereco do microsservico Saldo (que valida e debita).
saldo.url=http://localhost:8081

# --- MySQL: cada microsservico tem o seu proprio banco ---
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/banco_transferencias?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
