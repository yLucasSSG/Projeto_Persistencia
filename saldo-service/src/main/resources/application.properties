spring.application.name=saldo-service
server.port=8081

# --- MySQL: cada microsservico tem o seu proprio banco ---
# O banco e criado sozinho se nao existir. Usuario/senha: aqui ou nas variaveis MYSQL_USER e MYSQL_PASSWORD.
spring.datasource.url=jdbc:mysql://localhost:3306/banco_saldo?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

# O Hibernate cria/atualiza as tabelas a partir das classes @Entity.
spring.jpa.hibernate.ddl-auto=update
# Mostra o SQL no console (bom para demonstrar a persistencia).
spring.jpa.show-sql=true
