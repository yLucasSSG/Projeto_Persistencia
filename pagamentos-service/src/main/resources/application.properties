spring.application.name=pagamentos-service
server.port=8083

# Endereco do microsservico Saldo (que valida e debita).
saldo.url=http://localhost:8081

# --- MySQL: cada microsservico tem o seu proprio banco ---
spring.datasource.url=jdbc:mysql://localhost:3306/banco_pagamentos?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
